<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>angle-lab</title>
  <link rel="stylesheet" href="src/styles/app.css" />
</head>
<body>
  <div id="app">
    <header id="top-bar">
      <label class="bar-button">
        Library
        <input id="file-input" type="file" accept="image/*" hidden />
      </label>
      <label class="bar-button">
        Camera
        <input id="camera-input" type="file" accept="image/*" capture="environment" hidden />
      </label>
      <button id="fit-button" class="bar-button" type="button">Fit to screen</button>
      <div id="tool-group" role="group" aria-label="Tool">
        <button class="tool-button" data-tool="select" type="button">Select</button>
        <button class="tool-button" data-tool="point" type="button">Point</button>
        <button class="tool-button" data-tool="line" type="button">Line</button>
        <button class="tool-button" data-tool="angle" type="button">Angle</button>
        <button class="tool-button" data-tool="distance" type="button">Distance</button>
      </div>
      <button id="delete-selected-button" class="bar-button danger-button" type="button" disabled>Delete selected</button>
      <span id="zoom-readout" class="zoom-readout">100%</span>
    </header>
    <main id="canvas-area">
      <canvas id="view"></canvas>
      <canvas id="magnifier" class="magnifier" hidden></canvas>
    </main>
  </div>
  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
